    <style>
        .thankyou-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
        }

        .thankyou-card {
            background: #e9edf2;
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 650px;
            text-align: center;
            box-shadow: 18px 18px 38px rgba(163, 174, 190, 0.4), -18px -18px 38px rgba(255, 255, 255, 0.92);
        }

        .thankyou-icon {
            font-size: 72px;
            color: #22c55e;
            margin-bottom: 20px;
            animation: popIn 0.6s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0) rotate(-30deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.2) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .thankyou-card h1 {
            font-size: 32px;
            font-weight: 800;
            color: #303844;
            margin-bottom: 12px;
        }

        .thankyou-card p {
            color: #5a6674;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 8px;
        }

        .thankyou-card .highlight {
            color: #596bff;
            font-weight: 600;
        }

        .thankyou-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .thankyou-btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .thankyou-btn.primary {
            background: #596bff;
            color: #fff;
            box-shadow: 0 4px 15px rgba(89, 107, 255, 0.35);
        }

        .thankyou-btn.primary:hover {
            background: #4a5ce6;
            transform: translateY(-2px);
        }

        .thankyou-btn.secondary {
            background: #e9edf2;
            color: #303844;
            box-shadow: 4px 4px 12px rgba(163, 174, 190, 0.35), -4px -4px 12px rgba(255, 255, 255, 0.9);
        }

        .thankyou-btn.secondary:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .thankyou-card {
                padding: 30px 20px;
            }

            .thankyou-card h1 {
                font-size: 26px;
            }

            .thankyou-icon {
                font-size: 52px;
            }
        }
    </style>
